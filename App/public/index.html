<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Arbres de France</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #060d07;
      --bg2:     #0d1a0e;
      --card:    #111e12;
      --border:  #223324;
      --moss:    #4a7c59;
      --gold:    #c4a35a;
      --leaf:    #6aab7a;
      --amber:   #c4622a;
      --text:    #cfc9b5;
      --text2:   #6e8a73;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    #app {
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      background: var(--bg);
      font-family: 'Jost', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      flex-shrink: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }
    .hdr-deco {
      position: absolute;
      pointer-events: none;
      opacity: .09;
    }
    header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: .04em;
      line-height: 1.15;
    }
    header h1 em {
      display: block;
      font-style: normal;
      font-size: 10px;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      color: var(--text2);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .lang-btn {
      font-size: 22px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 9px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color .2s;
    }
    .lang-btn:active { transform: scale(.93); }

    /* ── BOTTOM NAV ── */
    nav {
      order: 10;
      flex-shrink: 0;
      display: flex;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bot);
    }
    .nav-btn {
      flex: 1;
      padding: 9px 2px 7px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text2);
      font-size: 9px;
      font-family: 'Jost', sans-serif;
      letter-spacing: .06em;
      text-transform: uppercase;
      transition: color .2s;
    }
    .nav-btn .ic { font-size: 19px; line-height: 1; }
    .nav-btn.active { color: var(--leaf); }

    /* ── SCREENS ── */
    .screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      display: none;
    }
    .screen.active { display: block; }
    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-thumb { background: var(--border); }

    /* ── ACCUEIL ── */
    .hero {
      position: relative;
      padding: 28px 20px 20px;
      text-align: center;
      overflow: hidden;
    }
    .hero-deco { position: absolute; pointer-events: none; }
    .hero h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 400;
      color: var(--gold);
      line-height: 1.15;
      position: relative;
      z-index: 1;
    }
    .hero h2 em {
      font-style: italic;
      color: var(--leaf);
    }
    .hero p {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text2);
      line-height: 1.65;
      position: relative;
      z-index: 1;
    }

    .stats-strip {
      display: flex;
      gap: 10px;
      padding: 0 16px 18px;
    }
    .stat {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 8px;
      text-align: center;
    }
    .stat .n {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      color: var(--gold);
      line-height: 1;
    }
    .stat .l {
      font-size: 9px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .12em;
      margin-top: 3px;
    }

    /* Famille section */
    .fam-title {
      padding: 14px 16px 6px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-style: italic;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .fam-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--border), transparent);
    }
    .fam-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 16px 14px;
      scrollbar-width: none;
    }
    .fam-scroll::-webkit-scrollbar { display: none; }
    .mini-card {
      flex-shrink: 0;
      width: 96px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .2s;
    }
    .mini-card:active { border-color: var(--moss); transform: scale(.97); }
    .mini-thumb {
      width: 96px;
      height: 68px;
      background: var(--bg2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      overflow: hidden;
    }
    .mini-thumb img { width:100%; height:100%; object-fit:cover; }
    .mini-name {
      padding: 6px 7px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      color: var(--text);
      line-height: 1.3;
    }

    /* ── ESSENCES LIST ── */
    .search-wrap {
      position: sticky;
      top: 0;
      z-index: 9;
      background: var(--bg);
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
    }
    .search-wrap input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-size: 14px;
      outline: none;
    }
    .search-wrap input::placeholder { color: var(--text2); }
    .search-wrap input:focus { border-color: var(--moss); }

    .tree-card {
      margin: 5px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      display: flex;
      gap: 12px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color .15s;
    }
    .tree-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--moss);
      opacity: 0;
      transition: opacity .2s;
    }
    .tree-card:active { border-color: var(--moss); }
    .tree-card:active::before { opacity: 1; }
    .tree-thumb {
      width: 58px; height: 58px;
      border-radius: 8px;
      background: var(--bg2);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .tree-thumb img { width:100%; height:100%; object-fit:cover; border-radius:8px; }
    .tree-meta h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.2;
    }
    .tree-meta .lat {
      font-style: italic;
      font-size: 11.5px;
      color: var(--text2);
      margin-top: 1px;
    }
    .tags { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
    .tag {
      font-size: 10px;
      background: rgba(74,124,89,.13);
      color: var(--leaf);
      border: 1px solid rgba(74,124,89,.3);
      border-radius: 4px;
      padding: 2px 6px;
    }

    /* ── DETAIL ── */
    #detail {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 50;
      display: none;
      flex-direction: column;
      padding-top: var(--safe-top);
    }
    #detail.open { display: flex; }
    .det-hdr {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
    }
    .back-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 18px;
      padding: 4px 10px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .det-hdr h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px;
      color: var(--gold);
      font-weight: 400;
    }
    .det-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(20px + var(--safe-bot));
    }
    .det-hero {
      width: 100%; height: 195px;
      background: var(--bg2);
      display: flex; align-items: center; justify-content: center;
      font-size: 60px;
      overflow: hidden;
    }
    .det-hero img { width:100%; height:100%; object-fit:cover; }
    .det-body { padding: 16px; }
    .det-body h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      font-weight: 400;
      color: var(--gold);
    }
    .det-lat {
      font-style: italic;
      color: var(--text2);
      font-size: 14px;
      margin-bottom: 14px;
    }
    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
    }
    .data-cell {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .data-cell .dl {
      font-size: 9.5px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .1em;
    }
    .data-cell .dv {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      color: var(--text);
      margin-top: 2px;
      line-height: 1.3;
    }
    .sec-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-style: italic;
      color: var(--gold);
      margin: 18px 0 8px;
    }
    .phenol-row {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 3px;
    }
    .ph-cell { text-align: center; }
    .ph-lbl { font-size: 8px; color: var(--text2); margin-bottom: 2px; }
    .ph-bar { height: 11px; border-radius: 2px; background: var(--bg2); }
    .ph-bar.fe { background: #4a7c59; }
    .ph-bar.fl { background: var(--gold); }
    .ph-bar.fr { background: #8b4513; }
    .ph-bar.co { background: var(--amber); }
    .legend-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 7px; }
    .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
    .leg-dot { width: 10px; height: 10px; border-radius: 2px; }
    .usage-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
    .usage-chip {
      background: rgba(196,163,90,.1);
      color: var(--gold);
      border: 1px solid rgba(196,163,90,.3);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
    }
    .anec {
      background: var(--card);
      border-left: 3px solid var(--moss);
      border-radius: 0 8px 8px 0;
      padding: 13px;
      font-size: 13px;
      font-style: italic;
      line-height: 1.65;
      color: var(--text);
      margin-top: 4px;
    }

    /* ── QUIZ ── */
    .quiz-wrap { padding: 14px; }
    .score-strip { display: flex; gap: 10px; margin-bottom: 14px; }
    .sc {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .sc .sn { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--gold); line-height:1; }
    .sc .sl { font-size: 9px; color: var(--text2); text-transform: uppercase; letter-spacing: .1em; }
    .qcard {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .q-img {
      width:100%; height:175px;
      background: var(--bg2);
      display: flex; align-items: center; justify-content: center;
      font-size: 58px; overflow: hidden;
    }
    .q-img img { width:100%; height:100%; object-fit:cover; }
    .q-text { padding: 13px 13px 4px; font-family:'Cormorant Garamond',serif; font-size: 18px; color:var(--text); }
    .q-opts {
      padding: 8px 13px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .q-opt {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      text-align: center;
      font-family: 'Jost', sans-serif;
      transition: all .18s;
      line-height: 1.3;
    }
    .q-opt.ok  { background: rgba(74,124,89,.28); border-color: var(--moss); color: var(--leaf); }
    .q-opt.bad { background: rgba(180,55,55,.2);  border-color: #b43c3c; color: #e07070; }
    .q-next {
      display: block;
      width: 100%;
      background: var(--moss);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-family: 'Jost', sans-serif;
      cursor: pointer;
      letter-spacing: .05em;
      margin-top: 4px;
    }

    /* ── CALENDRIER ── */
    .cal-wrap { padding: 14px; }
    .cal-tbl { margin-top: 10px; }
    .cal-hdr-row {
      display: flex;
      align-items: center;
      margin-bottom: 3px;
    }
    .cal-name-col { width: 105px; flex-shrink: 0; }
    .cal-months {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(12,1fr);
      gap: 1px;
    }
    .cal-mlbl { font-size: 8px; color: var(--text2); text-align: center; }
    .cal-row {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
      cursor: pointer;
    }
    .cal-name {
      width: 105px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 12.5px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .cal-bars {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(12,1fr);
      gap: 1px;
    }
    .cb { height: 9px; border-radius: 1px; background: var(--bg2); }

    /* ── CARTE ── */
    .carte-wrap { padding: 14px; }
    .carte-ttl {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      color: var(--gold);
      text-align: center;
      margin-bottom: 12px;
    }
    svg.map { width: 100%; max-width: 400px; display: block; margin: 0 auto; }
    .foret-box {
      margin-top: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      min-height: 80px;
    }
    .foret-box h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      color: var(--gold);
      margin-bottom: 5px;
    }
    .foret-box p { font-size: 12.5px; color: var(--text2); line-height: 1.55; }
    .foret-box .tags { margin-top: 8px; }
  </style>
</head>
<body>
<div id="app">

  <!-- ══ HEADER ══ -->
  <header>
    <!-- Décor feuilles SVG gauche -->
    <svg class="hdr-deco" style="left:-8px;top:-12px;width:90px;" viewBox="0 0 100 110">
      <path d="M55 100 C10 80 -5 40 15 5 C40 25 65 55 55 100Z" fill="#4a7c59"/>
      <line x1="15" y1="5" x2="55" y2="100" stroke="#6aab7a" stroke-width="1.2" opacity=".7"/>
      <path d="M30 75 C20 60 25 45 35 35" stroke="#6aab7a" stroke-width=".8" fill="none" opacity=".5"/>
      <path d="M40 55 C32 42 36 28 44 20" stroke="#6aab7a" stroke-width=".8" fill="none" opacity=".4"/>
    </svg>
    <!-- Décor feuilles SVG droite -->
    <svg class="hdr-deco" style="right:-8px;top:-12px;width:90px;transform:scaleX(-1);" viewBox="0 0 100 110">
      <path d="M55 100 C10 80 -5 40 15 5 C40 25 65 55 55 100Z" fill="#4a7c59"/>
      <line x1="15" y1="5" x2="55" y2="100" stroke="#6aab7a" stroke-width="1.2" opacity=".7"/>
    </svg>

    <div>
      <h1>Arbres de France<em id="hdr-sub">Guide des 50 Essences</em></h1>
    </div>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">🇬🇧</button>
  </header>

  <!-- ══ SCREENS ══ -->

  <!-- ACCUEIL -->
  <div class="screen active" id="sc-accueil">
    <div class="hero">
      <!-- grandes feuilles décoratives -->
      <svg class="hero-deco" style="left:-18px;top:0;width:110px;opacity:.1;" viewBox="0 0 130 200">
        <path d="M70 190 C5 150 -15 80 20 10 C60 50 100 120 70 190Z" fill="#4a7c59"/>
        <line x1="20" y1="10" x2="70" y2="190" stroke="#c4a35a" stroke-width="1.5"/>
        <path d="M35 160 C22 130 28 105 42 90" stroke="#6aab7a" stroke-width="1" fill="none"/>
        <path d="M50 125 C38 98 42 75 55 60" stroke="#6aab7a" stroke-width=".8" fill="none"/>
        <path d="M58 90 C48 68 52 48 63 34" stroke="#6aab7a" stroke-width=".7" fill="none"/>
      </svg>
      <svg class="hero-deco" style="right:-18px;top:10px;width:95px;opacity:.09;transform:scaleX(-1)rotate(15deg);" viewBox="0 0 130 200">
        <path d="M70 190 C5 150 -15 80 20 10 C60 50 100 120 70 190Z" fill="#4a7c59"/>
        <line x1="20" y1="10" x2="70" y2="190" stroke="#c4a35a" stroke-width="1.5"/>
        <path d="M35 160 C22 130 28 105 42 90" stroke="#6aab7a" stroke-width="1" fill="none"/>
      </svg>
      <!-- Petite branche en bas à gauche -->
      <svg class="hero-deco" style="left:10px;bottom:-5px;width:70px;opacity:.12;" viewBox="0 0 80 60">
        <path d="M5 55 C20 40 50 30 75 10" stroke="#4a7c59" stroke-width="2" fill="none"/>
        <path d="M25 45 C30 32 42 28 55 22" stroke="#4a7c59" stroke-width="1.2" fill="none"/>
        <ellipse cx="58" cy="20" rx="8" ry="5" fill="#4a7c59" transform="rotate(-30 58 20)"/>
        <ellipse cx="75" cy="9" rx="8" ry="5" fill="#4a7c59" transform="rotate(-45 75 9)"/>
        <ellipse cx="55" cy="21" rx="7" ry="4" fill="#4a7c59" transform="rotate(-20 55 21)"/>
      </svg>

      <h2>Les <em>Arbres</em><br>de France</h2>
      <p id="hero-p">Découvrez les 50 essences indigènes,<br>leurs secrets et leur histoire</p>
    </div>

    <div class="stats-strip">
      <div class="stat"><div class="n">50</div><div class="l" id="st1">Essences</div></div>
      <div class="stat"><div class="n">6</div><div class="l" id="st2">Familles</div></div>
      <div class="stat"><div class="n">13</div><div class="l" id="st3">Forêts</div></div>
    </div>

    <div id="home-body"></div>
  </div>

  <!-- ESSENCES -->
  <div class="screen" id="sc-essences">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Rechercher un arbre…" oninput="filterTrees(this.value)">
    </div>
    <div id="tree-list"></div>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="sc-quiz">
    <div class="quiz-wrap" id="quiz-wrap"></div>
  </div>

  <!-- CALENDRIER -->
  <div class="screen" id="sc-cal">
    <div class="cal-wrap" id="cal-wrap"></div>
  </div>

  <!-- CARTE -->
  <div class="screen" id="sc-carte">
    <div class="carte-wrap" id="carte-wrap"></div>
  </div>

  <!-- ══ NAV ══ -->
  <nav>
    <button class="nav-btn active" onclick="goTo('accueil',this)">
      <span class="ic">🌿</span><span id="nav0">Accueil</span>
    </button>
    <button class="nav-btn" onclick="goTo('essences',this)">
      <span class="ic">🌳</span><span id="nav1">Essences</span>
    </button>
    <button class="nav-btn" onclick="goTo('quiz',this)">
      <span class="ic">🧠</span><span id="nav2">Quiz</span>
    </button>
    <button class="nav-btn" onclick="goTo('cal',this)">
      <span class="ic">📅</span><span id="nav3">Calendrier</span>
    </button>
    <button class="nav-btn" onclick="goTo('carte',this)">
      <span class="ic">🗺️</span><span id="nav4">Carte</span>
    </button>
  </nav>

  <!-- ══ DETAIL OVERLAY ══ -->
  <div id="detail">
    <div class="det-hdr">
      <button class="back-btn" onclick="closeDetail()">←</button>
      <h2 id="det-title"></h2>
    </div>

// ════════════════════════════════════════════
//  PORTRAIT LOADER
// ════════════════════════════════════════════
const imgCache = {};
let lsOk = true;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){lsOk=false;return null;}}
function lsSet(k,v){try{if(lsOk)localStorage.setItem(k,v);}catch(e){lsOk=false;}}

async function loadPortrait(a) {
  if (imgCache[a.id]) { applyImg(a.id, imgCache[a.id]); return; }
  const k = 'wt_'+a.id;
  const cached = lsGet(k);
  if (cached) { imgCache[a.id]=cached; applyImg(a.id, cached); return; }
  try {
    const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(a.wiki));
    if (!r.ok) return;
    const d = await r.json();
    const src = d.thumbnail?.source;
    if (src) { lsSet(k,src); imgCache[a.id]=src; applyImg(a.id, src); }
  } catch(e) {}
}
function applyImg(id, src) {
  const ic = ARBRES.find(a=>a.id===id)?.ic || '🌿';
  ['th-'+id,'cth-'+id,'qimg-'+id,'dhero-'+id].forEach(elId => {
    const el = document.getElementById(elId);
    if (!el) return;
    const rad = elId.startsWith('dhero') ? 'border-radius:0' : 'border-radius:inherit';
    const img = document.createElement('img');
    img.src = src;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;'+rad;
    img.onerror = () => { el.innerHTML = ic; };
    el.innerHTML = '';
    el.appendChild(img);
  });
}

function renderEssences(q='') {
  const list = document.getElementById('tree-list');
  const src = q ? ARBRES.filter(a=>
    a.nom.toLowerCase().includes(q.toLowerCase())||
    a.nomEn.toLowerCase().includes(q.toLowerCase())||
    a.latin.toLowerCase().includes(q.toLowerCase())
  ) : ARBRES;

  if (q) {
    list.innerHTML = src.map(a=>cardHTML(a)).join('');
  } else {
    list.innerHTML = FAMILLES.map(fam=>{
      const sub = src.filter(a=>a.fam===fam);
      if (!sub.length) return '';
      return `<div class="fam-title">${FAM_ICON[fam]||'🌿'} ${T(fam,sub[0].famEn)}</div>`
        + sub.map(a=>cardHTML(a)).join('');
    }).join('');
  }
  src.forEach(a=>loadPortrait(a));
}
function cardHTML(a) {
  return `<div class="tree-card" onclick="openDetail(${a.id})">
    <div class="tree-thumb" id="cth-${a.id}">${a.ic}</div>
    <div class="tree-meta">
      <h3>${T(a.nom,a.nomEn)}</h3>
      <div class="lat">${a.latin}</div>
      <div class="tags">
        <span class="tag">↕ ${a.h}</span>
        <span class="tag">⏳ ${T(a.age,a.ageEn)}</span>
      </div>
    </div>
  </div>`;
}

const quizState = { score:0, total:0, answered:false, ready:false };
function initQuiz() {
  quizState.ready = true;
  nextQuestion();
}
function nextQuestion() {
  const wrap = document.getElementById('quiz-wrap');
  const correct = ARBRES[Math.floor(Math.random()*ARBRES.length)];
  const others = ARBRES.filter(a=>a.id!==correct.id).sort(()=>Math.random()-.5).slice(0,3);
  const opts = [correct,...others].sort(()=>Math.random()-.5);
  const qtypes = ['nom','latin','usage','age'];
  const qt = qtypes[Math.floor(Math.random()*qtypes.length)];
  let q;
  if (qt==='latin')  q = T(`Quel arbre porte le nom latin <em>${correct.latin}</em> ?`,`Which tree has the Latin name <em>${correct.latin}</em>?`);
  else if (qt==='usage') q = T(`Quel arbre est utilisé pour : ${T(correct.us,correct.usEn)[0]} ?`,`Which tree is used for: ${T(correct.us,correct.usEn)[0]}?`);
  else if (qt==='age') q = T(`Quel arbre peut vivre ${correct.age} ?`,`Which tree can live ${correct.ageEn}?`);
  else q = T('Identifiez cet arbre','Identify this tree');
  quizState.answered = false;
  wrap.innerHTML = `
    <div class="score-strip">
      <div class="sc"><div class="sn">${quizState.score}</div><div class="sl">${T('Points','Score')}</div></div>
      <div class="sc"><div class="sn">${quizState.total}</div><div class="sl">${T('Joués','Played')}</div></div>
      <div class="sc"><div class="sn">${quizState.total>0?Math.round(quizState.score/quizState.total*100):0}%</div><div class="sl">${T('Réussite','Success')}</div></div>
    </div>
    <div class="qcard">
      <div class="q-img" id="qimg-${correct.id}">${correct.ic}</div>
      <div class="q-text">${q}</div>
      <div class="q-opts">
        ${opts.map(o=>`<button class="q-opt" onclick="answer(${o.id===correct.id},this)">${T(o.nom,o.nomEn)}</button>`).join('')}
      </div>
    </div>
    <button class="q-next" id="q-next" onclick="nextQuestion()" style="display:none">${T('Question suivante →','Next question →')}</button>`;
  const cached = imgCache[correct.id] || localStorage.getItem('wt_'+correct.id);
  if (cached) applyImg(correct.id, cached);
  else loadPortrait(correct);
}
function answer(ok, btn) {
  if (quizState.answered) return;
  quizState.answered = true; quizState.total++;
  if (ok) { quizState.score++; btn.classList.add('ok'); }
  else {
    btn.classList.add('bad');
    document.querySelectorAll('.q-opt').forEach(b=>{ if(b!==btn) b.classList.add('ok'); });
  }
  document.querySelectorAll('.q-opt').forEach(b=>b.style.pointerEvents='none');
  document.getElementById('q-next').style.display='block';
}
